<!-- profile — ir: #profile. One person's page. The header is a one-row LIST
     region over app_user, so the regions nested in it hydrate against the
     person's row; a person nobody is leaves it empty and the region says so.
     The terminal owns the strip and the back stack. -->
<section class="screen" data-screen="profile">
  <header class="topline">
    <a class="back role-meta" data-route="home" data-text="{msg.back_home}">← início</a>
  </header>

  <p class="offline role-meta" data-text="{msg.offline}">O yogurt não está respondendo.</p>

  <div class="skeleton" aria-hidden="true">
    <div class="skel left-skel"></div>
    <div class="skel right-skel"></div>
  </div>

  <div class="person" data-live="app_user" data-filter="handle=eq.{param.handle}"
       data-empty="{msg.profile_not_found}">
    <template data-item>
      <div class="columns">
        <div class="left">
          <section class="panel">
            <div class="panel-body portrait">
              <span class="face big"><img class="photo" src="{photo_url}" alt="" width="160" height="160"><span class="initial big" aria-hidden="true" data-text="{handle}"></span></span>
              <h1 class="person-name role-band" dir="auto" data-text="{display_name}"></h1>
              <p class="person-handle role-meta" data-text="{handle}"></p>
              <p class="rel role-meta"><span class="chip role-label" data-text="{msg[relationship]}"></span></p>
              <ul class="counts role-meta">
                <li><b class="tally" data-live="friendship" data-filter="user_id=eq.{id}" data-project='{"n":"count"}' data-empty="{msg.friends_zero}"><template data-item><i data-text="{msg.friends_count}"></i></template></b></li>
                <li><a class="fans-link" data-route="fans" data-param-handle="{handle}"><b class="tally" data-live="fan" data-filter="idol_id=eq.{id}" data-project='{"n":"count"}' data-empty="{msg.fans_zero}"><template data-item><i data-text="{msg.fans_count}"></i></template></b></a></li>
              </ul>
              <!-- The smileys everyone sees: the cluster's own row for this person
                   (023), the level a message key the row carries. -->
              <p class="karma role-meta"><span class="smileys" data-live="karma_smiley" data-filter="rated_id=eq.{id}" data-empty="{msg.karma_unrated}"><template data-item><span class="smiley-row"><span class="k"><span data-text="{msg.trust_label}">confiável</span> <b aria-hidden="true" data-text="{msg[trust_key]}"></b><span class="sr-only" data-text="{msg.trust_of_three}"></span></span> <span class="k"><span data-text="{msg.cool_label}">legal</span> <b aria-hidden="true" data-text="{msg[cool_key]}"></b><span class="sr-only" data-text="{msg.cool_of_three}"></span></span> <span class="k"><span data-text="{msg.sexy_label}">sexy</span> <b aria-hidden="true" data-text="{msg[sexy_key]}"></b><span class="sr-only" data-text="{msg.sexy_of_three}"></span></span> <span class="raters" data-text="{msg.karma_raters}"></span></span></template></span></p>

              <!-- The controls (ir decision-relation-through-me, decision-live-relations).
                   Friendship and fan rows are public, so "do I" cannot be a probe on
                   the person's id alone; and a filter through an embed reads through
                   PostgREST, never live. So every relation is a list of my own rows,
                   each nesting a one-row probe on this page's person, and :has() over
                   the probe picks the row that is this page's; that row carries its own
                   undo, row-scoped. Forms that start a relation stay siblings in the
                   person's row, because they need the person's id. Regions and probes
                   carry no whitespace outside their templates. -->
              <div class="arms">
                <span class="me-probe" data-live="me" data-filter="id=eq.{id}"><template data-item><i></i></template></span>
                <span class="mine" data-live="me"><template data-item><span class="relation"><span class="friend-rows" data-live="friendship" data-filter="user_id=eq.{id}" data-empty=""><template data-item><span class="friend-row"><span class="person-probe" data-live="app_user" data-filter="id=eq.{friend_id}&handle=eq.{param.handle}" data-empty=""><template data-item><i></i></template></span><span class="friends-arm">
                  <span class="state-label role-meta" data-text="{msg.friends_state_label}">vocês são amigos</span>
                  <details>
                    <summary class="role-meta" data-text="{msg.unfriend_button}">desfazer amizade…</summary>
                    <form data-form="unfriend" data-entity="friendship" data-action="delete">
                      <button type="submit" class="danger role-meta" data-text="{msg.unfriend_confirm}">sim, desfazer a amizade</button>
                    <p class="invalid role-meta" hidden data-text="{msg.answer_failed}">Não deu pra responder.</p>
                    <p class="store-error role-meta" hidden data-text="{msg.answer_failed}">Não deu pra responder.</p>
                    </form>
                  </details>
                  <!-- My rating of this friend (ir decision-karma): my own karma row for
                       them, private, read on their id from the friendship row; the
                       update form lives in that row and has no button, so a tap on a
                       level is the save; the create form beside it is drawn only once
                       the region has stamped its empty line. -->
                  <span class="karma-mine" data-live="karma" data-filter="rated_id=eq.{friend_id}" data-empty="{msg.karma_mine_none}"><template data-item><span class="karma-row"><form class="karma-form" data-form="rate-again" data-entity="karma" data-action="update">
                    <span class="karma-title role-meta" data-text="{msg.karma_mine_label}">sua avaliação</span>
                    <fieldset class="level-row"><legend class="role-meta" data-text="{msg.trust_label}">trust</legend><label class="level"><input type="radio" name="trust" value="0" required data-value="{trust}"><span class="role-meta" data-text="{msg.karma_level_0}">nada</span></label><label class="level"><input type="radio" name="trust" value="1" required data-value="{trust}"><span class="role-meta" data-text="{msg.karma_level_1}">um pouco</span></label><label class="level"><input type="radio" name="trust" value="2" required data-value="{trust}"><span class="role-meta" data-text="{msg.karma_level_2}">bastante</span></label><label class="level"><input type="radio" name="trust" value="3" required data-value="{trust}"><span class="role-meta" data-text="{msg.karma_level_3}">muito</span></label></fieldset><fieldset class="level-row"><legend class="role-meta" data-text="{msg.cool_label}">cool</legend><label class="level"><input type="radio" name="cool" value="0" required data-value="{cool}"><span class="role-meta" data-text="{msg.karma_level_0}">nada</span></label><label class="level"><input type="radio" name="cool" value="1" required data-value="{cool}"><span class="role-meta" data-text="{msg.karma_level_1}">um pouco</span></label><label class="level"><input type="radio" name="cool" value="2" required data-value="{cool}"><span class="role-meta" data-text="{msg.karma_level_2}">bastante</span></label><label class="level"><input type="radio" name="cool" value="3" required data-value="{cool}"><span class="role-meta" data-text="{msg.karma_level_3}">muito</span></label></fieldset><fieldset class="level-row"><legend class="role-meta" data-text="{msg.sexy_label}">sexy</legend><label class="level"><input type="radio" name="sexy" value="0" required data-value="{sexy}"><span class="role-meta" data-text="{msg.karma_level_0}">nada</span></label><label class="level"><input type="radio" name="sexy" value="1" required data-value="{sexy}"><span class="role-meta" data-text="{msg.karma_level_1}">um pouco</span></label><label class="level"><input type="radio" name="sexy" value="2" required data-value="{sexy}"><span class="role-meta" data-text="{msg.karma_level_2}">bastante</span></label><label class="level"><input type="radio" name="sexy" value="3" required data-value="{sexy}"><span class="role-meta" data-text="{msg.karma_level_3}">muito</span></label></fieldset>
                    <div class="karma-foot">
                      <p class="saved role-meta" role="status" data-text="{msg.saved_line}">salvo</p>
                      <p class="invalid role-meta" hidden data-text="{msg.rate_blank}">Escolha os três.</p>
                      <p class="store-error role-meta" hidden data-text="{msg.rate_failed}">Não deu pra avaliar.</p>
                    </div>
                  </form><form class="unrate-form" data-form="unrate" data-entity="karma" data-action="delete">
                    <button type="submit" class="outline role-meta" data-text="{msg.unrate_button}">desfazer avaliação</button>
                    <p class="store-error role-meta" hidden data-text="{msg.unrate_failed}">Não deu pra desfazer.</p>
                  </form></span></template></span>
                  <form class="karma-form karma-new" data-form="rate" data-entity="karma" data-action="create">
                    <input type="hidden" name="rated_id" data-value="{friend_id}">
                    <span class="karma-title role-meta" data-text="{msg.karma_new_label}">como essa pessoa é pra você?</span>
                    <fieldset class="level-row"><legend class="role-meta" data-text="{msg.trust_label}">trust</legend><label class="level"><input type="radio" name="trust" value="0" required><span class="role-meta" data-text="{msg.karma_level_0}">nada</span></label><label class="level"><input type="radio" name="trust" value="1" required><span class="role-meta" data-text="{msg.karma_level_1}">um pouco</span></label><label class="level"><input type="radio" name="trust" value="2" required><span class="role-meta" data-text="{msg.karma_level_2}">bastante</span></label><label class="level"><input type="radio" name="trust" value="3" required><span class="role-meta" data-text="{msg.karma_level_3}">muito</span></label></fieldset><fieldset class="level-row"><legend class="role-meta" data-text="{msg.cool_label}">cool</legend><label class="level"><input type="radio" name="cool" value="0" required><span class="role-meta" data-text="{msg.karma_level_0}">nada</span></label><label class="level"><input type="radio" name="cool" value="1" required><span class="role-meta" data-text="{msg.karma_level_1}">um pouco</span></label><label class="level"><input type="radio" name="cool" value="2" required><span class="role-meta" data-text="{msg.karma_level_2}">bastante</span></label><label class="level"><input type="radio" name="cool" value="3" required><span class="role-meta" data-text="{msg.karma_level_3}">muito</span></label></fieldset><fieldset class="level-row"><legend class="role-meta" data-text="{msg.sexy_label}">sexy</legend><label class="level"><input type="radio" name="sexy" value="0" required><span class="role-meta" data-text="{msg.karma_level_0}">nada</span></label><label class="level"><input type="radio" name="sexy" value="1" required><span class="role-meta" data-text="{msg.karma_level_1}">um pouco</span></label><label class="level"><input type="radio" name="sexy" value="2" required><span class="role-meta" data-text="{msg.karma_level_2}">bastante</span></label><label class="level"><input type="radio" name="sexy" value="3" required><span class="role-meta" data-text="{msg.karma_level_3}">muito</span></label></fieldset>
                    <div class="karma-foot">
                      <button type="submit" class="role-meta" data-text="{msg.rate_button}">avaliar</button>
                      <p class="invalid role-meta" hidden data-text="{msg.rate_blank}">Escolha os três.</p>
                      <p class="store-error role-meta" hidden data-text="{msg.rate_failed}">Não deu pra avaliar.</p>
                    </div>
                  </form>
                </span></span></template></span><span class="fan-probe" data-live="fan" data-select="*,idol:app_user!idol_id!inner(handle)" data-filter="fan_id=eq.{id}&idol.handle=eq.{param.handle}" data-empty=""><template data-item><form class="unfan-arm" data-form="unfan" data-entity="fan" data-action="delete">
                  <span class="state-label role-meta" data-text="{msg.fan_state_label}">você é fã</span>
                  <button type="submit" class="outline role-meta" data-text="{msg.unfan_button}">deixar de ser fã</button>
                  <p class="invalid role-meta" hidden data-text="{msg.fan_failed}">Não deu pra virar fã.</p>
                  <p class="store-error role-meta" hidden data-text="{msg.fan_failed}">Não deu pra virar fã.</p>
                </form></template></span></span></template></span>
                <span class="sent-rows" data-live="friend_request_sent" data-empty=""><template data-item><span class="sent-row"><span class="person-probe" data-live="app_user" data-filter="id=eq.{to_id}&handle=eq.{param.handle}" data-empty=""><template data-item><i></i></template></span><form class="requested-arm" data-form="withdraw-request" data-entity="friend_request_sent" data-action="delete">
                  <span class="state-label role-meta" data-text="{msg.request_sent_label}">pedido enviado</span>
                  <button type="submit" class="outline role-meta" data-text="{msg.withdraw_button}">cancelar pedido</button>
                  <p class="invalid role-meta" hidden data-text="{msg.request_failed}">Não deu pra enviar o pedido.</p>
                  <p class="store-error role-meta" hidden data-text="{msg.request_failed}">Não deu pra enviar o pedido.</p>
                </form></span></template></span>
                <span class="inbox" data-live="friend_request" data-empty=""><template data-item><span class="inbox-row"><span class="person-probe" data-live="app_user" data-filter="id=eq.{from_id}&handle=eq.{param.handle}" data-empty=""><template data-item><i></i></template></span><span class="pending-arm">
                  <span class="pending-label role-meta" data-text="{msg.wants_friend_label}">quer ser seu amigo</span>
                  <form class="accept" data-form="accept-request" data-entity="friend_request" data-action="update">
                    <!-- A checked box submits a boolean; a hidden text would reach a bool column as the word. -->
                    <input type="checkbox" name="accepted" checked hidden aria-hidden="true">
                    <button type="submit" class="role-meta" data-text="{msg.accept_button}">aceitar</button>
                    <p class="invalid role-meta" hidden data-text="{msg.answer_failed}">Não deu pra responder.</p>
                    <p class="store-error role-meta" hidden data-text="{msg.answer_failed}">Não deu pra responder.</p>
                  </form>
                  <form class="decline" data-form="decline-request" data-entity="friend_request" data-action="delete">
                    <button type="submit" class="outline role-meta" data-text="{msg.decline_button}">recusar</button>
                    <p class="invalid role-meta" hidden data-text="{msg.answer_failed}">Não deu pra responder.</p>
                    <p class="store-error role-meta" hidden data-text="{msg.answer_failed}">Não deu pra responder.</p>
                  </form>
                </span></span></template></span>

                <p class="own-note role-meta"><span data-text="{msg.own_page_note}">Este é o seu perfil.</span> <!-- title binds so the item pass addresses a route link with no params (ir decision-edits-and-members). -->
                <a class="edit-link" data-route="edit" title="{msg.edit_profile_cta}" data-text="{msg.edit_profile_cta}">editar perfil →</a></p>

                <form class="ask-arm" data-form="ask-friend" data-entity="friend_request_sent" data-action="create">
                  <input type="hidden" name="to_id" data-value="{id}">
                  <button type="submit" class="role-meta" data-text="{msg.add_friend_button}">adicionar como amigo</button>
                  <p class="invalid role-meta" hidden data-text="{msg.request_failed}">Não deu pra enviar o pedido.</p>
                  <p class="store-error role-meta" hidden data-text="{msg.request_failed}">Não deu pra enviar o pedido.</p>
                </form>
                <form class="fan-arm" data-form="be-fan" data-entity="fan" data-action="create">
                  <input type="hidden" name="idol_id" data-value="{id}">
                  <button type="submit" class="outline role-meta" data-text="{msg.be_fan_button}">ser fã</button>
                  <p class="invalid role-meta" hidden data-text="{msg.fan_failed}">Não deu pra virar fã.</p>
                  <p class="store-error role-meta" hidden data-text="{msg.fan_failed}">Não deu pra virar fã.</p>
                </form>
              </div>
            </div>
          </section>

          <!-- Their communities, newest first, the count in the band; Membership
               is server-durable and carries no form here, so the embed is safe. -->
          <section class="panel communities">
            <h2 class="band role-band"><span data-text="{msg.communities_panel_label}">comunidades</span> <span class="count role-meta">(<b class="tally" data-live="membership" data-filter="user_id=eq.{id}" data-project='{"n":"count"}' data-empty="0"><template data-item><i data-text="{n}"></i></template></b>)</span></h2>
            <ul class="tiles community-tiles" data-live="membership" data-filter="user_id=eq.{id}&limit=12"
                data-select="*,community:community!community_id(name,photo_url)"
                data-order="created_at.desc,id.asc" data-empty="{msg.communities_panel_empty}">
              <template data-item>
                <li class="tile">
                  <a data-route="community" data-param-id="{community_id}">
                    <span class="face"><img class="photo" src="{community.photo_url}" alt="" width="72" height="72"><span class="initial" aria-hidden="true" data-text="{community.name}"></span></span>
                    <span class="name role-meta" data-text="{community.name}"></span>
                  </a>
                </li>
              </template>
            </ul>
          </section>
        </div>

        <div class="right">
          <section class="panel">
            <h2 class="band role-band"><span data-text="{msg.about_label}">quem sou eu</span></h2>
            <div class="panel-body">
              <p class="about role-body" data-text="{about}"></p>
              <p class="about-empty role-meta" data-text="{msg.about_empty}">Ainda não contou quem é.</p>
            </div>
          </section>

          <section class="panel">
            <h2 class="band role-band"><span data-text="{msg.details_label}">informações</span></h2>
            <dl class="panel-body details role-body">
              <dt class="role-meta" data-text="{msg.relationship_label}">relacionamento</dt><dd data-text="{msg[relationship]}"></dd>
              <dt class="role-meta" data-text="{msg.lives_in_label}">mora em</dt><dd><span data-text="{city}"></span><span class="sep">, </span><span data-text="{country}"></span></dd>
              <dt class="role-meta" data-text="{msg.birthday_label}">aniversário</dt><dd data-text="{birthday}" data-text-format="date"></dd>
            </dl>
          </section>

          <section class="panel interests">
            <h2 class="band role-band"><span data-text="{msg.interests_label}">interesses</span></h2>
            <dl class="panel-body details role-body">
              <dt class="role-meta" data-text="{msg.passions_label}">paixões</dt><dd data-text="{passions}"></dd>
              <dt class="role-meta" data-text="{msg.music_label}">música</dt><dd data-text="{music}"></dd>
              <dt class="role-meta" data-text="{msg.movies_label}">filmes</dt><dd data-text="{movies}"></dd>
              <dt class="role-meta" data-text="{msg.books_label}">livros</dt><dd data-text="{books}"></dd>
            </dl>
          </section>

          <!-- The scrapbook's teaser (ir decision-scrapbook): the newest three,
               the count beside one link that is both "read on" and "write one". -->
          <section class="panel scraps">
            <h2 class="band role-band"><span data-text="{msg.scrapbook_label}">recados</span> <a class="count role-meta" data-route="scrapbook" data-param-handle="{handle}"><span data-text="{msg.see_all_scraps}">ver todos os recados</span> (<b class="tally" data-live="scrap" data-filter="owner_id=eq.{id}" data-project='{"n":"count"}' data-empty="0"><template data-item><i data-text="{n}"></i></template></b>)</a></h2>
            <ul class="rows" data-live="scrap" data-filter="owner_id=eq.{id}&limit=3"
                data-select="*,author:app_user!author_id(handle,display_name,photo_url)"
                data-order="created_at.desc,id.desc" data-empty="{msg.teaser_empty}">
              <template data-item>
                <li class="row scrap">
                <span class="face small"><img class="photo" src="{author.photo_url}" alt="" width="36" height="36"><span class="initial small" aria-hidden="true" data-text="{author.handle}"></span></span>
                <p class="scrap-line role-meta">
                  <a class="who-link" data-route="profile" data-param-handle="{author.handle}" data-text="{author.display_name}"></a><a class="who-handle" data-route="profile" data-param-handle="{author.handle}" data-text="{author.handle}"></a>
                  <time class="when" datetime="{created_at}" data-text="{created_at}" data-text-format="datetime"></time>
                </p>
                <p class="scrap-body role-body" data-text="{body}"></p>
                <span class="may" data-live="me" data-filter="id=eq.{author_id}" data-empty=""><template data-item><i></i></template></span>
                <div class="scrap-foot role-meta"><a class="reply" data-route="scrapbook" data-param-handle="{author.handle}" data-text="{msg.reply_link}">responder</a></div>
                </li>
              </template>
            </ul>
            <p class="teaser-foot role-meta"><a data-route="scrapbook" data-param-handle="{handle}" data-text="{msg.leave_scrap_label}">deixar um recado</a></p>
          </section>

          <!-- The testimonials' teaser: the newest three approved, the count in
               the band's link, the foot's link to the box. Live table, so the
               writer is a nested region on their own key, not an embed. -->
          <section class="panel testimonials">
            <h2 class="band role-band"><span data-text="{msg.testimonials_label}">depoimentos</span> <a class="count role-meta" data-route="testimonials" data-param-handle="{handle}"><span data-text="{msg.see_all_testimonials}">ver todos os depoimentos</span> (<b class="tally" data-live="testimonial" data-filter="subject_id=eq.{id}" data-project='{"n":"count"}' data-empty="0"><template data-item><i data-text="{n}"></i></template></b>)</a></h2>
            <ul class="rows" data-live="testimonial" data-filter="subject_id=eq.{id}&limit=3"
                data-order="created_at.desc,id.desc" data-empty="{msg.testimonials_teaser_empty}"><template data-item>
                <li class="row testimonial">
                <span class="who" data-live="app_user" data-filter="id=eq.{author_id}" data-empty=""><template data-item><span class="who-item"><span class="face small"><img class="photo" src="{photo_url}" alt="" width="36" height="36"><span class="initial small" aria-hidden="true" data-text="{handle}"></span></span><a class="who-link" data-route="profile" data-param-handle="{handle}" data-text="{display_name}"></a><a class="who-handle" data-route="profile" data-param-handle="{handle}" data-text="{handle}"></a></span></template></span>
                <time class="when role-meta" datetime="{created_at}" data-text="{created_at}" data-text-format="datetime"></time>
                <p class="scrap-body role-body" data-text="{body}"></p>
                </li>
              </template></ul>
            <p class="teaser-foot role-meta"><a data-route="testimonials" data-param-handle="{handle}" data-text="{msg.write_testimonial_label}">escrever depoimento</a></p>
          </section>

          <!-- Their friends: one filter on user_id, because the 015 mirror
               keeps a row per direction (ir decision-friendship-mirror). -->
          <section class="panel">
            <h2 class="band role-band"><span data-text="{msg.friends_title}">amigos</span> <a class="count role-meta" data-route="friends" data-param-handle="{handle}"><span data-text="{msg.see_all_friends}">ver todos os amigos</span> (<b class="tally" data-live="friendship" data-filter="user_id=eq.{id}" data-project='{"n":"count"}' data-empty="0"><template data-item><i data-text="{n}"></i></template></b>)</a></h2>
            <ul class="tiles" data-live="friendship" data-filter="user_id=eq.{id}&limit=12"
                data-select="*,friend:app_user!friend_id(handle,display_name,photo_url)"
                data-order="created_at.desc,id.asc" data-empty="{msg.friends_empty}">
              <template data-item>
                <li class="tile">
                  <a data-route="profile" data-param-handle="{friend.handle}">
                    <span class="face"><img class="photo" src="{friend.photo_url}" alt="" width="72" height="72"><span class="initial" aria-hidden="true" data-text="{friend.handle}"></span></span>
                    <span class="name role-meta" data-text="{friend.display_name}"></span>
                    <span class="handle role-label" data-text="{friend.handle}"></span>
                  </a>
                </li>
              </template>
            </ul>
          </section>
        </div>
      </div>
    </template>
  </div>
</section>
